<!DOCTYPE html>
<html>
<head>
<title>How Rich Are You?</title>
<style>
body{
font-family: Arial;
text-align:center;
background:#111;
color:white;
}

input{
padding:10px;
font-size:18px;
}

button{
padding:10px 20px;
font-size:18px;
background:red;
color:white;
border:none;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:24px;
}
</style>
</head>

<body>

<h1>How Rich Are You?</h1>

<p>Enter your monthly income</p>

<input type="number" id="income" placeholder="Enter income">

<br><br>

<button onclick="checkRich()">Check</button>

<div id="result"></div>

<script>
function checkRich(){

let income = document.getElementById("income").value;

let percent = Math.min(99, Math.floor(income/100));

document.getElementById("result").innerHTML =
"You are richer than " + percent + "% of people in the world!";
}
</script>

</body>
</html>
